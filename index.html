<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS &amp; GYN Data Filter</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a3c5e;--primary-light:#2a5a8e;--primary-dark:#0f2740;
  --accent:#2ecc71;--accent-dark:#27ae60;
  --bg:#eef2f7;--bg-white:#fff;--bg-card:#fff;
  --text:#1a1a2e;--text-muted:#6b7b8d;
  --border:#d0d9e4;--border-light:#e4eaf0;
  --shadow:0 2px 12px rgba(26,60,94,.08);
  --shadow-lg:0 8px 32px rgba(26,60,94,.12);
  --radius:8px;
  --transition:all .3s cubic-bezier(.4,0,.2,1)
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:12px 32px;text-align:center;box-shadow:0 4px 20px rgba(26,60,94,.25);position:sticky;top:0;z-index:500;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.header-title{flex:1;min-width:280px}
.header h1{font-size:1.55rem;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.header p{font-size:.88rem;opacity:.85;font-weight:300}
.header-actions{display:flex;gap:10px;align-items:center}
.header .btn-outline{color:#fff;border-color:rgba(255,255,255,0.6);background:transparent}
.header .btn-outline:hover{background:rgba(255,255,255,0.15);color:#fff;border-color:#fff}
.header .btn-primary{background:var(--accent);color:#fff;border:none}
.header .btn-primary:hover{background:var(--accent-dark)}
.container{max-width:1440px;margin:0 auto;padding:20px;padding-top:24px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-dark)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}.btn-outline:hover{background:var(--primary);color:#fff}
.btn-danger{background:#e74c3c;color:#fff}.btn-danger:hover{background:#c0392b}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-icon{padding:5px 7px;background:transparent;border:1px solid var(--border);cursor:pointer;border-radius:4px;transition:var(--transition);color:var(--text-muted);font-size:.85rem}
.btn-icon:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-download{background:#27ae60;color:#fff;padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:6px}
.btn-download:hover{background:#219a52}
.filter-area{direction:ltr;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:visible}
.filter-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border-light);flex-wrap:wrap;gap:10px}
.filter-header h2{font-size:1.1rem;color:var(--primary);display:flex;align-items:center;gap:8px}
.filter-sections{overflow:hidden;border-radius:0 0 var(--radius) var(--radius)}
.section{border-bottom:1px solid var(--border-light)}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;cursor:pointer;transition:var(--transition);user-select:none}
.section-header:hover{background:var(--bg)}
.section-header h3{font-size:.9rem;color:var(--primary);font-weight:600;display:flex;align-items:center;gap:6px}
.section-header h3 .sec-icon{font-size:1.1rem}
.section-chevron{font-size:.7rem;color:var(--text-muted);transition:transform .3s}
.section.collapsed .section-chevron{transform:rotate(-90deg)}
.section-body{padding:12px 20px 16px;display:flex;flex-wrap:wrap;gap:12px;overflow:hidden;transition:max-height .4s ease,padding .3s ease,opacity .3s ease;opacity:1;max-height:600px}
.section.collapsed .section-body{max-height:0!important;padding-top:0;padding-bottom:0;opacity:0}
.field-group{display:flex;flex-direction:column;gap:4px;min-width:160px}
.field-group label{font-size:.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
.field-group select,.field-group input[type="text"],.field-group input[type="number"],.field-group input[type="date"]{padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:.85rem;background:#fafbfc;transition:var(--transition);width:100%}
.field-group select:focus,.field-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,60,94,.1)}
.range-group{display:flex;gap:6px;align-items:center}
.range-group span{font-size:.75rem;color:var(--text-muted)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow-y:auto;padding:4px 0}
.checkbox-group label{font-size:.82rem;display:flex;align-items:center;gap:4px;background:#f0f4f8;padding:3px 10px;border-radius:4px;cursor:pointer;transition:var(--transition);font-weight:400;text-transform:none;letter-spacing:0}
.checkbox-group label:hover{background:#dce6f0}
.checkbox-group input[type="checkbox"]{accent-color:var(--primary);width:14px;height:14px}
.table-area{direction:ltr;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border-light);flex-wrap:wrap;gap:10px}
.table-toolbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.table-toolbar .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-box{position:relative}
.search-box input{padding:7px 12px 7px 32px;border:1.5px solid var(--border);border-radius:6px;font-size:.85rem;width:220px;transition:var(--transition)}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,60,94,.1)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted)}
.col-vis-toggle{position:relative}
.col-vis-dropdown{position:absolute;top:100%;right:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:12px;z-index:100;width:340px;max-width:calc(100vw - 20px);max-height:450px;overflow-y:auto;display:none}
.col-vis-dropdown.open{display:block}
.col-vis-dropdown h4{font-size:.85rem;color:var(--primary);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-light)}
.col-vis-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.8rem}
.col-vis-item:hover{background:var(--bg);border-radius:3px}
.col-vis-item input[type="checkbox"]{accent-color:var(--primary);width:14px;height:14px;cursor:pointer}
.col-vis-item label{cursor:pointer;font-size:.8rem}
.col-vis-section{display:flex;align-items:center;gap:6px;padding:6px 0 3px;margin-top:6px;border-top:1.5px solid var(--border-light);font-weight:700;font-size:.82rem;color:var(--primary);cursor:pointer;user-select:none}
.col-vis-section:hover{color:var(--primary-dark);background:var(--bg);border-radius:3px}
.col-vis-section input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.col-vis-all{display:flex;align-items:center;gap:6px;padding:4px 0 8px;margin-bottom:4px;border-bottom:2px solid var(--primary);font-weight:700;font-size:.85rem;color:var(--primary);cursor:pointer;user-select:none}
.col-vis-all:hover{color:var(--primary-dark)}
.col-vis-all input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.table-wrapper{max-height:600px;overflow:auto;position:relative}
.table-wrapper table{width:100%;border-collapse:collapse;font-size:.82rem;white-space:nowrap}
.table-wrapper th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left;font-weight:600;position:sticky;top:0;z-index:10;user-select:none}
.table-wrapper td{padding:8px 12px;border-bottom:1px solid var(--border-light);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.table-wrapper tr:hover td{background:#f0f5fa}
.table-wrapper tr.expanded td{background:#e8f0fe}
.row-num{background:#f4f6f9;font-weight:600;color:var(--text-muted);text-align:center;min-width:40px;position:sticky;left:0;z-index:5}
.row-num-hdr{position:sticky;left:0;z-index:15;min-width:40px;text-align:center}
.action-col{position:sticky;right:0;z-index:5;background:var(--bg-card);min-width:55px;text-align:center}
.action-col-hdr{position:sticky;right:0;z-index:15;min-width:55px;text-align:center}
.table-wrapper tr:hover .action-col{background:#f0f5fa}
.table-wrapper tr.expanded .action-col{background:#e8f0fe}
.detail-row td{padding:0!important;border-bottom:2px solid var(--primary)}
.detail-card{padding:16px 20px;background:linear-gradient(135deg,#f8fafc,#eef2f7);border-left:4px solid var(--primary);margin:6px 8px 6px 40px;border-radius:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.detail-card .di{font-size:.82rem}.detail-card .di strong{color:var(--primary);font-weight:600;margin-right:4px}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border-light);flex-wrap:wrap;gap:10px}
.page-info{font-size:.85rem;color:var(--text-muted)}
.page-controls{display:flex;gap:4px}
.page-btn{padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;font-size:.82rem;transition:var(--transition)}
.page-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;opacity:0;pointer-events:none;transition:opacity .35s ease}
.overlay.open{opacity:1;pointer-events:auto}
.form-panel{position:fixed;top:0;right:-780px;width:760px;max-width:96vw;height:100vh;background:#fff;z-index:1001;transition:right .4s cubic-bezier(.4,0,.2,1);overflow-y:auto;direction:rtl;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.form-panel.open{right:0}
.fp-header{position:sticky;top:0;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.fp-header h2{font-size:1.15rem;font-weight:700}
.fp-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.fp-close:hover{background:rgba(255,255,255,.35)}
.fp-body{padding:24px}
.fsec{margin-bottom:22px;border:1px solid var(--border-light);border-radius:8px;overflow:hidden}
.fsec-title{background:var(--bg);padding:12px 16px;font-weight:700;color:var(--primary);font-size:.92rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:var(--transition)}
.fsec-title:hover{background:#e0e8f0}
.fsec-title .chev{transition:transform .3s;font-size:.7rem}
.fsec.collapsed .fsec-title .chev{transform:rotate(-90deg)}
.fsec-body{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;overflow:hidden;transition:max-height .4s ease,padding .3s ease,opacity .3s ease;opacity:1;max-height:4000px}
.fsec.collapsed .fsec-body{max-height:0!important;padding-top:0;padding-bottom:0;opacity:0}
.ff{display:flex;flex-direction:column;gap:4px}
.ff.fw{grid-column:1/-1}
.ff label{font-size:.8rem;font-weight:600;color:var(--text-muted)}
.ff input,.ff select,.ff textarea{padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:.88rem;transition:var(--transition);direction:rtl;width:100%}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,60,94,.1)}
.ff textarea{min-height:56px;resize:vertical}
.cb-grid{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.cb-grid>strong{width:100%;margin-bottom:2px;font-size:.85rem;color:var(--primary)}
.cb-grid label{font-size:.84rem;display:flex;align-items:center;gap:4px;background:#f0f4f8;padding:4px 12px;border-radius:4px;cursor:pointer;transition:var(--transition)}
.cb-grid label:hover{background:#dce6f0}
.cb-grid input[type="checkbox"]{accent-color:var(--primary);width:14px;height:14px}
.radio-group{display:flex;gap:12px;flex-wrap:wrap}
.radio-group label{font-size:.88rem;display:flex;align-items:center;gap:5px;cursor:pointer}
.radio-group input[type="radio"]{accent-color:var(--primary);width:15px;height:15px}
.fcond{display:none;grid-column:1/-1}
.fcond.vis{display:contents}
.fp-btns{display:flex;gap:10px;justify-content:flex-start;padding:20px 0;border-top:1px solid var(--border-light);margin-top:24px;grid-column:1/-1;flex-wrap:wrap}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:auto;background:#fff;border:1.5px solid var(--primary);border-top:none;border-radius:0 0 6px 6px;max-height:180px;overflow-y:auto;z-index:2000;display:none}
.ac-drop.open{display:block}
.ac-item{padding:7px 12px;cursor:pointer;font-size:.85rem;border-bottom:1px solid var(--border-light);direction:ltr;text-align:left}
.ac-item:hover,.ac-item.active{background:var(--primary);color:#fff}
.toast-box{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 28px;border-radius:8px;color:#fff;font-size:.9rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:tin .4s ease;min-width:260px;text-align:center;pointer-events:auto}
.toast.success{background:#27ae60}.toast.error{background:#e74c3c}.toast.info{background:var(--primary)}
@keyframes tin{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}
.loading{display:flex;justify-content:center;align-items:center;padding:60px;color:var(--text-muted);font-size:1rem}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
footer{margin-top:26px;text-align:center;color:var(--text-muted);font-size:0.95rem;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){
  .container{padding:10px;padding-top:14px}
  .header{flex-direction:column;align-items:center;text-align:center;padding:15px}
  .header-title{width:100%}
  .header-actions{width:100%;justify-content:center;margin-top:10px}
  .header h1{font-size:1.3rem}
  .table-toolbar{flex-direction:column;align-items:flex-start}
  .search-box input{width:100%}
  .form-panel{width:100%;max-width:100vw}
  .fsec-body{grid-template-columns:1fr}
  .detail-card{grid-template-columns:1fr 1fr;margin-left:4px}
  .fp-btns{flex-direction:column;gap:8px;padding:12px 0}
  .fp-btns button{width:100%}
  .col-vis-toggle{width:100%;}
  .col-vis-dropdown{width:100%;max-width:none;left:0;right:0;box-shadow:var(--shadow-lg);max-height:calc(100vh - 160px);}
}
.table-wrapper::-webkit-scrollbar,.col-vis-dropdown::-webkit-scrollbar,.checkbox-group::-webkit-scrollbar,.form-panel::-webkit-scrollbar,.ac-drop::-webkit-scrollbar{width:6px;height:6px}
.table-wrapper::-webkit-scrollbar-track,.col-vis-dropdown::-webkit-scrollbar-track,.checkbox-group::-webkit-scrollbar-track,.form-panel::-webkit-scrollbar-track,.ac-drop::-webkit-scrollbar-track{background:#f0f0f0}
.table-wrapper::-webkit-scrollbar-thumb,.col-vis-dropdown::-webkit-scrollbar-thumb,.form-panel::-webkit-scrollbar-thumb,.ac-drop::-webkit-scrollbar-thumb{background:#b0b8c4;border-radius:3px}
.table-wrapper::-webkit-scrollbar-thumb:hover,.col-vis-dropdown::-webkit-scrollbar-thumb:hover,.form-panel::-webkit-scrollbar-thumb:hover,.ac-drop::-webkit-scrollbar-thumb:hover{background:#8895a5}
  /* ISO overlay styles for date inputs inside the form panel */
  .iso-date-wrap{position:relative;display:block}
  .iso-date{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:block;font-size:0.95rem;color:#334}
  .iso-date-wrap input[type="date"]{padding-inline-start:12px;padding-inline-end:12px}
  .iso-date-hide-native{color:transparent;text-shadow:none}
  /* Hide native date text in WebKit (Android Chrome) by targeting datetime-edit pseudo elements */
  input[type="date"].iso-date-hide-native::-webkit-datetime-edit,
  input[type="date"].iso-date-hide-native::-webkit-datetime-edit-text,
  input[type="date"].iso-date-hide-native::-webkit-datetime-edit-month-field,
  input[type="date"].iso-date-hide-native::-webkit-datetime-edit-day-field,
  input[type="date"].iso-date-hide-native::-webkit-datetime-edit-year-field {
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    text-shadow: none !important;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <h1>OBS &amp; GYN Data Filter</h1>
    <p>Comprehensive patient data management — filter, review &amp; edit cases</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline btn-sm" id="toggleAllBtn" onclick="toggleAllSections()">Expand All</button>
    <button class="btn btn-outline btn-sm" onclick="resetFilters()">Reset</button>
    <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
  </div>
</div>

<div class="container">
  <div class="filter-area">
    <div class="filter-header">
      <h2>Filter Cases</h2>
      <button class="btn btn-accent" onclick="window.open('https://ham9y.github.io/Form-input/','_blank')">+ Add New Case</button>
    </div>
    <div id="filterSections" class="filter-sections"></div>
  </div>
  <div class="table-area">
    <div class="table-toolbar">
      <div class="left">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="quickSearch" placeholder="Search by name or ticket ID..." oninput="applyQuickSearch()">
        </div>
        <span id="rowCount" class="page-info"></span>
      </div>
      <div class="right">
        <div class="col-vis-toggle">
          <button class="btn btn-outline btn-sm" onclick="toggleColVis(event)">Columns</button>
          <div class="col-vis-dropdown" id="colVisDropdown">
            <h4>Toggle Column Visibility</h4>
            <div id="colVisList"></div>
          </div>
        </div>
        <button class="btn-download" onclick="exportExcel()">📥 Download Excel</button>
      </div>
    </div>
    <div class="table-wrapper" id="tableWrapper">
      <div class="loading" id="loadingIndicator"><div class="spinner"></div>Loading data...</div>
    </div>
    <div class="pagination" id="pagination"></div>
    <footer>وفقنا الله وإياكم</footer>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeFormPanel()"></div>
<div class="form-panel" id="formPanel">
  <div class="fp-header">
    <h2 id="formTitle">Edit Case</h2>
    <button class="fp-close" onclick="closeFormPanel()" title="Close">X</button>
  </div>
  <div class="fp-body" id="formBody"></div>
</div>

<div class="toast-box" id="toastBox"></div>

<script>

function normalizeSheetDateValue(val){
  if(typeof val !== 'string') return val;
  var d=new Date(val);
  if(isNaN(d.getTime())) return val;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Format a date into 'yyyy Month dd' for visible labels (e.g., 2026 June 11)
function formatDateLabel(v){
  if(!v) return '';
  var d=new Date(v);
  if(isNaN(d.getTime())) return v;
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return d.getFullYear()+' '+months[d.getMonth()]+' '+String(d.getDate()).padStart(2,'0');
}

// Attach ISO overlay displays for date inputs (used by dynamic edit form)
function attachIsoDateDisplays(root){
  try{
    (root||document).querySelectorAll('input[type="date"]').forEach(function(el){
      if(el.dataset.isoAttached) return; el.dataset.isoAttached='1';
      var wrap=document.createElement('div'); wrap.className='iso-date-wrap'; wrap.style.display = getComputedStyle(el).display === 'block' ? 'block' : 'inline-block';
      el.parentNode.insertBefore(wrap, el); wrap.appendChild(el);
      var span=document.createElement('span'); span.className='iso-date'; wrap.appendChild(span);
      var update=function(){ span.textContent = el.value? formatDateLabel(el.value) : ''; };
      // hide native text and keep overlay as visible value
      el.classList.add('iso-date-hide-native');
      el.addEventListener('input', update); el.addEventListener('change', update); el.addEventListener('blur', update);
      wrap.addEventListener('click', function(){ try{ el.showPicker && el.showPicker(); el.focus(); }catch(e){ el.focus(); } });
      update();
    });
  }catch(e){console.warn('attachIsoDateDisplays error',e);}
}

async function fetchJSON(url,retries=3){
  let lastErr;
  for(let i=0;i<retries;i++){
    try{const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'_t='+Date.now(),{method:'GET',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
    catch(e){lastErr=e;console.warn('Attempt '+(i+1)+'/'+retries+':',e.message);if(i<retries-1)await new Promise(x=>setTimeout(x,1200*(i+1)));}
  }
  throw lastErr;
}
async function loadData(){
  const el=document.getElementById('loadingIndicator');
  try{
    if(el)el.innerHTML='<div class="spinner"></div>Loading data...';
    const json=await fetchJSON(SCRIPT_URL+'?action=read');
    if(json.error)throw new Error(json.error);
    allData=[];allRowNums=[];
    if(json.data&&json.data.length){
      json.data.forEach(item=>{
        let d=item.data||[];
        while(d.length<89)d.push('');
        d=d.map(function(v,i){
          var key=FIELD_BY_INDEX[i];
          return key&&DATE_RANGE.has(key)?normalizeSheetDateValue(v):v;
        });
        allData.push(d);
        allRowNums.push(item._row);
      });
    }
    filteredData=[...allData];filteredRowNums=[...allRowNums];
    initVisibleCols();renderTable();
  }catch(e){
    console.error('loadData:',e);
    if(el)el.innerHTML='<div style="color:#e74c3c;text-align:center;padding:20px">Failed to load data. <button onclick="loadData()" style="color:var(--primary);cursor:pointer;text-decoration:underline;background:none;border:none;font-size:inherit">Retry</button></div>';
    showToast('Error: '+e.message,'error');
  }
}

function parseCSV(text){
  const rows=[];
  let currentRow=[],currentField='';
  let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const char=text[i],nextChar=text[i+1];
    if(inQuotes){
      if(char==='"'){if(nextChar==='"'){currentField+='"';i++;}else inQuotes=false;}
      else currentField+=char;
    }else{
      if(char==='"')inQuotes=true;
      else if(char===','){currentRow.push(currentField);currentField='';}
      else if(char==='\n'){currentRow.push(currentField);rows.push(currentRow);currentRow=[];currentField='';}
      else if(char==='\r'){if(nextChar==='\n')i++;currentRow.push(currentField);rows.push(currentRow);currentRow=[];currentField='';}
      else currentField+=char;
    }
  }
  if(currentField!==''||currentRow.length>0){currentRow.push(currentField);rows.push(currentRow);}
  return rows;
}

function renderColVis(){

// Read the checkbox state AFTER the browser has toggled it
function handleColChange(f){
  var cb=document.getElementById('cv_'+f);

}

function syncColVisCheckboxes(){

  if(allCb) allCb.checked=ALL_FIELDS.every(f=>visibleCols.has(f));

  var secNames=Object.keys(FILTER_SECTIONS);
  secNames.forEach(function(sec,si){
    var fields=FILTER_SECTIONS[sec];
    var secCb=document.getElementById('cvs_'+si);
    if(secCb) secCb.checked=fields.every(f=>visibleCols.has(f));

    fields.forEach(function(f){
      var cb=document.getElementById('cv_'+f);

// "All Columns" click — determine toggle direction from current state

// Section click — toggle all fields in section based on current state

function collectFilters(){
  var f={};
  document.querySelectorAll('.filter-area select[data-field]').forEach(function(el){if(el.value)f[el.dataset.field]={t:'s',v:el.value};});
  document.querySelectorAll('.filter-area input[data-field][type="text"]').forEach(function(el){if(el.value.trim())f[el.dataset.field]={t:'t',v:el.value.trim().toLowerCase()};});
  document.querySelectorAll('.filter-area input[data-range="from"][type="number"]').forEach(function(el){var k=el.dataset.field;if(el.value){if(!f[k])f[k]={t:'nr'};f[k].from=parseFloat(el.value);}});
  document.querySelectorAll('.filter-area input[data-range="to"][type="number"]').forEach(function(el){var k=el.dataset.field;if(el.value){if(!f[k])f[k]={t:'nr'};f[k].to=parseFloat(el.value);}});
  document.querySelectorAll('.filter-area input[data-range="from"][type="date"]').forEach(function(el){var k=el.dataset.field;if(el.value){if(!f[k])f[k]={t:'dr'};f[k].from=el.value;}});
  document.querySelectorAll('.filter-area input[data-range="to"][type="date"]').forEach(function(el){var k=el.dataset.field;if(el.value){if(!f[k])f[k]={t:'dr'};f[k].to=el.value;}});
  var cbf={};document.querySelectorAll('.filter-area .checkbox-group input:checked').forEach(function(cb){var k=cb.dataset.field;if(!cbf[k])cbf[k]=[];cbf[k].push(cb.value);});
  Object.keys(cbf).forEach(function(k){f[k]={t:'c',v:cbf[k]};});
  return f;
}
function applyFilters(){
  var filters=collectFilters();filteredData=[];filteredRowNums=[];
  allData.forEach(function(row,i){
    var ok=true;
    for(var k in filters){
      var idx=FIM[k];if(idx===undefined)continue;var cv=(row[idx]||'').toString().toLowerCase();var fl=filters[k];
      if(fl.t==='s'&&cv!==fl.v.toLowerCase()){ok=false;break;}
      if(fl.t==='t'&&!cv.includes(fl.v)){ok=false;break;}
      if(fl.t==='nr'){var v=parseFloat(row[idx]);if(isNaN(v))continue;if(fl.from!==undefined&&v<fl.from){ok=false;break;}if(fl.to!==undefined&&v>fl.to){ok=false;break;}}
      if(fl.t==='dr'){var d=new Date(row[idx]);if(isNaN(d.getTime()))continue;if(fl.from&&new Date(fl.from)>d){ok=false;break;}if(fl.to&&new Date(fl.to)<d){ok=false;break;}}
      if(fl.t==='c'){var items=cv.split("\n").map(function(s){return s.trim();});if(!fl.v.some(function(v){return items.includes(v.toLowerCase());})){ok=false;break;}}
    }
    if(ok){filteredData.push(row);filteredRowNums.push(allRowNums[i]);}
  });
  if(searchTerm){var t=searchTerm.toLowerCase();var td=[],tr=[];filteredData.forEach(function(row,i){if((row[1]||'').toString().toLowerCase().includes(t)||(row[5]||'').toString().toLowerCase().includes(t)){td.push(row);tr.push(filteredRowNums[i]);}});filteredData=td;filteredRowNums=tr;}
  currentPage=1;expandedRows.clear();renderTable();showToast('Found '+filteredData.length+' records','info');
}

function waitForBlobDownloader(timeoutMs = 2000, intervalMs = 100) {
  return new Promise((resolve) => {
    if (typeof window.BlobDownloader !== 'undefined') return resolve(true);
    const started = Date.now();
    const id = setInterval(() => {
      if (typeof window.BlobDownloader !== 'undefined') {
        clearInterval(id);
        resolve(true);
      } else if (Date.now() - started > timeoutMs) {
        clearInterval(id);
        resolve(false);
      }
    }, intervalMs);
  });
}

function downloadFileToAndroid(blob, filename) {
  return new Promise(async (resolve) => {
    try {
      const available = await waitForBlobDownloader(2000, 100);
      if (!available) {
        console.warn('BlobDownloader not available; fallback to browser.');
        return resolve(false);
      }
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          window.BlobDownloader.downloadBlob(e.target.result, filename);
          console.log('Sent blob to BlobDownloader for', filename);
          resolve(true);
        } catch (err) {
          console.error('Error calling BlobDownloader.downloadBlob:', err);
          resolve(false);
        }
      };
      reader.onerror = function (err) {
        console.error('FileReader error converting blob to dataURL', err);
        resolve(false);
      };
      reader.readAsDataURL(blob);
    } catch (ex) {
      console.error('downloadFileToAndroid exception', ex);
      resolve(false);
    }
  });
}

async function exportExcel() {

    filteredData.forEach(function (r) { d.push(cols.map(function (f) { return renderCellValue(f, r[FIM[f]]); })); });
    var ws = XLSX.utils.aoa_to_sheet(d);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'OBS_GYN_Data');
    var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var filename = 'OBS_GYN_Filtered_Data.xlsx';
    var sent = await downloadFileToAndroid(blob, filename);
    if (sent) {
      showToast('Download started (Android)', 'success');
      return;
    }
    XLSX.writeFile(wb, filename);
    showToast('Excel exported (browser)', 'success');
  } catch (err) {
    console.error('exportExcel error:', err);
    showToast('Export failed: ' + (err && err.message ? err.message : 'unknown'), 'error');
  }
}

    fsec('🩺 Previous C/S or not',fradio('prev_cs','Previous C/S',FORM_OPT.prev_cs_radio)+'<div class="fcond" id="cond_cs_number">'+fi('cs_number','Number of previous C/S','number','','','','0')+'</div>')+
    fsec('🩻 Vital signs (MEOW SCORING)',fs('sbp','Systolic Blood Pressure',FORM_OPT.sbp)+fs('dbp','Diastolic Blood Pressure',FORM_OPT.dbp)+fs('pulse','Pulse',FORM_OPT.pulse)+fs('temperature','Temperature',FORM_OPT.temperature)+fs('resp_rate','Respiratory Rate',FORM_OPT.resp_rate)+fs('consciousness','Level of Consciousness',FORM_OPT.consciousness)+fs('o2_sat','O2 Saturation',FORM_OPT.o2_sat)+fs('urine_output','Urine Output',FORM_OPT.urine_output)+fs('meow_score','MEOW Total Score',FORM_OPT.meow_score))+
    fsec('🔬 Investigations',fcb('lab_tests','Laboratory investigations',FORM_OPT.lab_tests)+fi('positive_lab_data','Positive laboratory data','text','Mention positive data or free')+fcb('imaging','Imaging investigations',FORM_OPT.imaging)+fi('positive_imaging_data','Positive imaging data','text','Mention positive data or free'))+
    fsec('🩸 Blood transfusion',fs('blood_transfusion','Blood component transfusion',FORM_OPT.blood_transfusion_select)+fi('blood_group','Blood group (ABO SYSTEM and RH typing)','text','e.g., A+')+'<div class="fcond" id="cond_transfused">'+fcb('transfused','Transfused components',FORM_OPT.transfused)+'</div>')+
    fsec('📋 Management',fs('case_type','Obstetric or Gynecological case',FORM_OPT.case_type)+'<div class="fcond" id="cond_obstetric">'+fcb('preg_conditions','Any pregnancy induced medical conditions',FORM_OPT.preg_conditions)+'<div class="fcond" id="cond_preg_other">'+fi('preg_condition_other','Other pregnancy induced condition','text')+'</div>'+fs('gestational_age','Gestational Age',FORM_OPT.gestational_age)+fi('exact_gestational_age','Exact Gestational Age (weeks)','number','','','','0')+fs('admission_reason','The patient is admitted for',FORM_OPT.admission_reason)+'<div class="fcond" id="cond_delivery"><div class="cb-grid"><strong>🤰 If obstetric case, then</strong></div>'+fs('labour_onset','Onset of Labour',FORM_OPT.labour_onset)+fs('pregnancy_type','Single or multiple pregnancy',FORM_OPT.pregnancy_type)+fs('fetal_presentation','Fetal Presentation',FORM_OPT.fetal_presentation)+fi('delivery_date','Date of delivery','date')+fs('delivery_mode','Mode of delivery',FORM_OPT.delivery_mode)+'<div class="fcond" id="cond_cs_indications">'+fcb('cs_indications','Indications of C/S',FORM_OPT.cs_indications)+'</div><div class="cb-grid"><strong>📝 Pregnancy outcome</strong></div>'+fi('fetus_gender','Male or female fetus','text','Gender of fetus/fetii')+fcb('fetal_complications','Fetal Complications',FORM_OPT.fetal_complications)+fcb('maternal_complications','Maternal Complications',FORM_OPT.maternal_complications)+fi('delivery_report','Please give a brief report of delivery','textarea','','fw')+fs('robson','Robson classification',FORM_OPT.robson)+fs('contraceptive','Contraceptive method used',FORM_OPT.contraceptive)+'<div class="fcond" id="cond_contraceptive_refusal">'+fi('contraceptive_refusal_reason','Cause of refusal of contraceptive method','text')+'</div></div><div class="fcond" id="cond_abortion"><div class="cb-grid"><strong>🩹 Abortion Case</strong></div>'+fs('abortion_type','Type of Abortion',FORM_OPT.abortion_type)+fs('abortion_intervention','Intervention',FORM_OPT.abortion_intervention)+fi('abortion_intervention_details','Intervention Details','textarea','','fw')+fi('abortion_treatment','Treatment Prescribed','textarea','','fw')+fs('abortion_contraceptive','Contraceptive Method',FORM_OPT.abortion_contraceptive)+'</div><div class="fcond" id="cond_vesicular"><div class="cb-grid"><strong>🔬 Vesicular Mole</strong></div>'+fi('vesicular_ga_lmp','Gestational Age (by LMP)','text','e.g., 10 weeks')+fs('vesicular_type','Partial or Complete',FORM_OPT.vesicular_type)+fs('vesicular_intervention','Intervention',FORM_OPT.vesicular_intervention)+fi('vesicular_medications','Medications Prescribed','textarea','','fw')+fs('vesicular_contraceptive','Contraceptive Method',FORM_OPT.vesicular_contraceptive)+'</div><div class="fcond" id="cond_ectopic"><div class="cb-grid"><strong>❗ Ectopic Pregnancy</strong></div>'+fs('ectopic_type','Type of Ectopic',FORM_OPT.ectopic_type)+fs('ectopic_disturbed','Disturbed or Not',FORM_OPT.ectopic_disturbed)+fcb('ectopic_intervention','Intervention (select all that apply)',FORM_OPT.ectopic_intervention)+fi('ectopic_intervention_brief','Brief of Intervention','textarea','','fw')+fs('ectopic_contraceptive','Contraceptive Method',FORM_OPT.ectopic_contraceptive)+'</div><div class="fcond" id="cond_followup"><div class="cb-grid"><strong>📅 Follow‑Up Case</strong></div>'+fi('followup_indication','Indication of Admission','textarea','','fw')+fi('followup_treatment','Treatment Prescribed','textarea','','fw')+'</div></div>')+
    fsec('👩‍⚕️ Gynecological Case','<div class="fcond" id="cond_gynecological">'+fs('gyn_diagnosis','Diagnosis',FORM_OPT.gyn_diagnosis)+fs('gyn_intervention','Intervention Done',FORM_OPT.gyn_intervention)+fi('gyn_op_date','Date of Operation','date')+fi('gyn_complications','Complications of Operation','textarea','','fw')+fi('gyn_report','Brief Report of Operation','textarea','','fw')+fi('gyn_treatment','Treatment After Operation','textarea','','fw')+'</div>')+
    fsec('⚠️ Complicated Case','<div class="fcond" id="cond_complicated">'+fcb('complicated_location','Complicated Outside or Inside',FORM_OPT.complicated_location)+fi('complicated_presentation','Presentation of Complication','textarea','','fw')+fi('complicated_intervention_done','Intervention Done','textarea','','fw')+fi('complicated_intervention_todo','Intervention to be Done','textarea','','fw')+fi('complicated_treatment','Treatment After Interventions','textarea','Including referral to ICU','fw')+fi('complicated_medical_report','Medical Report (Arabic)','textarea','Surgical/gynecology report number and date','fw')+'</div>')+
    fsec('👨‍⚕️ SURGEONS',fac('consultant','الاستشاري / رئيس المجموعة')+fac('specialist','أخصائي / أخصائي مساعد')+fac('specialist2','أخصائي / أخصائي مساعد (2) <span class="hint">optional</span>')+fac('residents','طبيب مقيم')+fac('residents2','طبيب مقيم (2) <span class="hint">optional</span>')+fi('scrub_nurse','الممرضة <span class="hint">ممرضة العمليات-الكشك او القسم المسئوله</span>','text')+fs('treatment_type','نوع العلاج',FORM_OPT.treatment_type)+fac('entered_by','القائم بإدخال البيانات'))+
    '<div class="fp-btns"><button type="submit" class="btn btn-accent">Save Changes</button><button type="button" class="btn btn-outline" onclick="closeFormPanel()">Cancel</button><button type="button" class="btn btn-danger btn-sm" onclick="deleteCase()" style="margin-right:auto">Delete</button></div>'+
  '</form>';
  attachFormListeners();
  setTimeout(function(){setupAC('f_consultant');setupAC('f_specialist');setupAC('f_specialist2');setupAC('f_residents');setupAC('f_residents2');setupAC('f_entered_by');},50);
  // attach ISO date displays for date inputs inside the form panel
  setTimeout(function(){attachIsoDateDisplays(document.getElementById('formBody'));},60);
}

function fsec(t,c){return '<div class="fsec"><div class="fsec-title" onclick="this.parentElement.classList.toggle(\'collapsed\')">'+t+'<span class="chev">&#9660;</span></div><div class="fsec-body">'+c+'</div></div>';}
function fi(f,l,tp,ph,cls,min,mx,mv){var id='f_'+f;if(tp==='textarea')return '<div class="ff '+(cls==='fw'?'fw':'')+'"><label for="'+id+'">'+l+'</label><textarea id="'+id+'" name="'+f+'" rows="2" placeholder="'+(ph||'')+'"></textarea></div>';var ex='';if(tp==='number')ex='min="'+(min||'0')+'" step="any"'+(mv?' max="'+mv+'"':'');return '<div class="ff '+(cls==='fw'?'fw':'')+'"><label for="'+id+'">'+l+'</label><input id="'+id+'" name="'+f+'" type="'+(tp||'text')+'" placeholder="'+(ph||'')+'" '+ex+'></div>';}
function fs(f,l,opts){var id='f_'+f;var h='<div class="ff"><label for="'+id+'">'+l+'</label><select id="'+id+'" name="'+f+'"><option value="">-- Select --</option>';(opts||[]).forEach(function(o){h+='<option value="'+o+'">'+o+'</option>';});return h+'</select></div>';}
function fcb(f,l,opts){var h='<div class="cb-grid"><strong>'+l+'</strong>';(opts||[]).forEach(function(o){h+='<label><input type="checkbox" name="'+f+'" value="'+o+'"> '+o+'</label>';});return h+'</div>';}
function fradio(f,l,opts){var h='<div class="ff"><label>'+l+'</label><div class="radio-group">';(opts||[]).forEach(function(o){h+='<label><input type="radio" name="'+f+'" value="'+o+'"> '+o+'</label>';});return h+'</div></div>';}
function fac(f,l){var id='f_'+f;return '<div class="ff ac-wrap"><label for="'+id+'">'+l+'</label><input id="'+id+'" name="'+f+'" type="text" autocomplete="off"><div class="ac-drop"></div></div>';}

function tc(id,show){var el=document.getElementById(id);if(el){if(show)el.classList.add('vis');else el.classList.remove('vis');}}
function attachFormListeners(){
  document.querySelectorAll('input[name="prev_surgery"]').forEach(function(r){r.addEventListener('change',function(){tc('cond_surgery_type',r.value==='YES');});});
  document.querySelectorAll('input[name="parity_type"]').forEach(function(r){r.addEventListener('change',function(){tc('cond_multipara',r.value==='Multipara');});});
  document.querySelectorAll('input[name="prev_cs"]').forEach(function(r){r.addEventListener('change',function(){tc('cond_cs_number',r.value==='Yes');});});
  var bt=document.getElementById('f_blood_transfusion');if(bt)bt.addEventListener('change',function(){tc('cond_transfused',bt.value==='yes');});
  var ct=document.getElementById('f_case_type');if(ct)ct.addEventListener('change',function(){updateCaseType(ct.value);});
  var ar=document.getElementById('f_admission_reason');if(ar)ar.addEventListener('change',function(){updateAdmissionReason(ar.value);});
  var dm=document.getElementById('f_delivery_mode');if(dm)dm.addEventListener('change',function(){tc('cond_cs_indications',dm.value==='C/S');});
  var cp=document.getElementById('f_contraceptive');if(cp)cp.addEventListener('change',function(){tc('cond_contraceptive_refusal',cp.value==='None');});
  document.querySelectorAll('input[name="preg_conditions"]').forEach(function(cb){cb.addEventListener('change',function(){var o=document.querySelector('input[name="preg_conditions"][value="other"]');tc('cond_preg_other',o&&o.checked);});});
}
function updateCaseType(v){tc('cond_obstetric',v==='Obstetric case');tc('cond_gynecological',v==='Gynecological case');tc('cond_complicated',v==='Complicated case(outside or inside)');if(v!=='Obstetric case')['cond_delivery','cond_abortion','cond_vesicular','cond_ectopic','cond_followup'].forEach(function(id){tc(id,false);});}
function updateAdmissionReason(v){['cond_delivery','cond_abortion','cond_vesicular','cond_ectopic','cond_followup'].forEach(function(id){tc(id,false);});var m={'For delivery':'cond_delivery','Abortion':'cond_abortion','For follow up':'cond_followup','Vesicular mole':'cond_vesicular','Ectopic pregnancy':'cond_ectopic'};if(m[v])tc(m[v],true);}

function populateForm(row){
  if(!row)return;
  Object.keys(FIM).forEach(function(f){
    var val = row[FIM[f]] || '';
    if(CB_FIELDS.has(f)){
      var vs = String(val).split(/\n/).map(function(v){return v.trim();}).filter(Boolean);
      document.querySelectorAll('input[name="'+f+'"]').forEach(function(cb){ cb.checked = vs.some(function(v){ return v.toLowerCase() === cb.value.toLowerCase(); }); });
    } else if(RADIO_FIELDS.has(f)){
      document.querySelectorAll('input[name="'+f+'"]').forEach(function(r){ r.checked = (r.value.toLowerCase() === String(val).trim().toLowerCase()); });
    } else {
      var el = document.getElementById('f_'+f);
      if(!el) return;
      if(el.tagName === 'SELECT'){
        el.value = val;
        if(el.value !== val){
          for(var i=0;i<el.options.length;i++){
            if(el.options[i].value.toLowerCase() === String(val).trim().toLowerCase()){ el.value = el.options[i].value; break; }
          }
        }
      } else if(el.tagName === 'INPUT' && el.type === 'date' || DATE_RANGE.has(f)){
        try{
          el.value = val ? normalizeSheetDateValue(val) : '';
        }catch(e){ el.value = String(val); }
        // trigger input event so any ISO display updates
        try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
      } else {
        el.value = val;
      }
    }
  });
  var rp=(row[FIM.residents]||'').split('\n');var r1=document.getElementById('f_residents'),r2=document.getElementById('f_residents2');if(r1&&rp[0])r1.value=rp[0].trim();if(r2&&rp[1])r2.value=rp[1].trim();
  var sv=function(id){var el=document.querySelector('input[name="'+id+'"]:checked');return el?el.value:'';};
  tc('cond_surgery_type',sv('prev_surgery')==='YES');tc('cond_multipara',sv('parity_type')==='Multipara');tc('cond_cs_number',sv('prev_cs')==='Yes');
  var btEl=document.getElementById('f_blood_transfusion');tc('cond_transfused',btEl&&btEl.value==='yes');
  var ct=row[FIM.case_type]||'';updateCaseType(ct);
  if(ct==='Obstetric case'){updateAdmissionReason(row[FIM.admission_reason]||'');tc('cond_cs_indications',(row[FIM.delivery_mode]||'')==='C/S');tc('cond_contraceptive_refusal',(row[FIM.contraceptive]||'')==='None');var pcV=row[FIM.preg_conditions]||'';tc('cond_preg_other',pcV.split(/\n/).map(function(v){return v.trim().toLowerCase();}).includes('other'));}
}

async function submitForm(e){
  e.preventDefault();if(isSubmitting)return;isSubmitting=true;
  var fd={};
  Object.keys(FIM).forEach(function(f){
    if(f==='timestamp'||f==='specialist2'||f==='residents2')return;
    if(CB_FIELDS.has(f))fd[f]=Array.from(document.querySelectorAll('input[name="'+f+'"]:checked')).map(function(c){return c.value;}).join('\n');
    else if(RADIO_FIELDS.has(f)){var ch=document.querySelector('input[name="'+f+'"]:checked');fd[f]=ch?ch.value:'';}
    else{var el=document.getElementById('f_'+f);fd[f]=el?el.value:'';}
  });
  var sp1=document.getElementById('f_specialist'),sp2=document.getElementById('f_specialist2');
  fd.specialist=[sp1?sp1.value.trim():'',sp2?sp2.value.trim():''].filter(Boolean).join('\n');
  var rs1=document.getElementById('f_residents'),rs2=document.getElementById('f_residents2');
  fd.residents=[rs1?rs1.value.trim():'',rs2?rs2.value.trim():''].filter(Boolean).join('\n');

  var params=new URLSearchParams();
  params.append('action','update');
  params.append('row',filteredRowNums[editIdx]);
  Object.keys(fd).forEach(function(f){if(fd[f]!==undefined)params.append(f,fd[f]);});

  showToast('Saving...','info');
  try{
    var result=await scriptWrite(params);
    if(result&&result.error){showToast('Error: '+result.error,'error');}
    else{showToast('Case updated successfully!','success');closeFormPanel();Object.keys(FIM).forEach(function(f){allData[editIdx][FIM[f]]=fd[f]||'';});filteredData=[...allData];filteredRowNums=[...allRowNums];applyFilters();setTimeout(function(){loadData();},1500);}
  }catch(err){console.error(err);showToast('Update sent (verification pending)','info');closeFormPanel();setTimeout(function(){loadData();},3000);}
  finally{isSubmitting=false;}
}

async function deleteCase(){
  if(editIdx<0)return;if(!confirm('Delete this case permanently?'))return;
  showToast('Deleting...','info');
  try{
    var params=new URLSearchParams();params.append('action','delete');params.append('row',filteredRowNums[editIdx]);
    var result=await scriptGet(params);
    if(result&&result.error){showToast('Error: '+result.error,'error');return;}
    showToast('Case deleted!','success');closeFormPanel();setTimeout(function(){loadData();},1000);
  }catch(err){console.error(err);showToast('Delete failed: '+err.message,'error');}
}

function showToast(msg,type){type=type||'info';var c=document.getElementById('toastBox'),t=document.createElement('div');t.className='toast '+type;t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.animation='tout .4s ease forwards';setTimeout(function(){t.remove();},400);},3000);}

async function init(){renderFilters();await Promise.all([loadData(),loadDoctors()]);setupFilterAC();showToast('Data loaded successfully','success');}
init();
</script>
